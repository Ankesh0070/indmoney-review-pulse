<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INDmoney · Mutual Fund FAQ Assistant</title>
<meta name="description" content="Facts-only FAQ chatbot for mutual fund schemes. Every answer cites one official source. No advice, no PII." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%235A2DDB'/%3E%3Ctext x='20' y='26' font-family='Arial,sans-serif' font-weight='800' font-size='13' fill='white' text-anchor='middle'%3EIND%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app">

  <!-- Top bar -->
  <header class="topbar">
    <div class="logo" aria-hidden="true">IND</div>
    <div class="brand">
      <b>INDmoney Assistant</b>
      <span>Mutual Fund FAQ · Facts-only</span>
    </div>
    <button class="toggle" id="themeBtn" aria-label="Switch theme">
      <span id="themeIcon">🌙</span>
    </button>
  </header>

  <!-- Messages -->
  <main class="messages" id="chat" role="log" aria-live="polite" aria-label="Conversation"></main>

  <!-- Jump to latest message -->
  <button class="scroll-btn" id="scrollBtn" type="button" aria-label="Scroll to latest message">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    New messages
  </button>

  <!-- Quick suggestions (hide after first message) -->
  <div class="suggestions" id="suggestions">
    <button class="chip" data-q="What is the exit load of HDFC Flexi Cap Fund?">Exit load of HDFC Flexi Cap?</button>
    <button class="chip" data-q="What is the ELSS lock-in period?">ELSS lock-in period?</button>
    <button class="chip" data-q="How do I download my capital gains statement?">Download capital gains statement?</button>
  </div>

  <!-- Composer -->
  <div class="composer">
    <div class="composer-inner">
      <input id="q" type="text" autocomplete="off" placeholder="Message INDmoney Assistant…" />
      <button class="send" id="sendBtn" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div class="foot">Facts from official AMC / registrar / regulator pages · Not investment advice · No PII stored</div>
  </div>

</div>

<script src="js/corpus.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
